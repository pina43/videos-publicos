<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulário de Serviços</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #333;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      color: #1a1a2e;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-bottom: 18px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 20px 28px;
      max-width: 820px;
      margin: 0 auto;
    }

    .data-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid #eee;
    }

    .data-row label {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
    }

    .data-row input[type="date"] {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead tr {
      background: #1a1a2e;
      color: #fff;
    }

    thead th {
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    tbody tr:nth-child(even) {
      background: #f8f9fa;
    }

    tbody tr:hover {
      background: #eef2ff;
    }

    tbody td {
      padding: 8px 12px;
      vertical-align: middle;
      border-bottom: 1px solid #eee;
    }

    td.servico-label {
      font-weight: 600;
      color: #1a1a2e;
      width: 180px;
    }

    select, input[type="number"], input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      color: #333;
      outline: none;
      transition: border 0.2s;
    }

    select:focus, input:focus {
      border-color: #4361ee;
    }

    td.valor-calc {
      font-weight: 700;
      min-width: 120px;
      text-align: right;
    }

    td.valor-calc.br { color: #2d6a4f; }
    td.valor-calc.us { color: #1d3557; }
    td.valor-calc.empty { color: #bbb; font-style: italic; font-weight: normal; }

    .totais {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 2px solid #eee;
    }

    .total-box {
      padding: 12px 22px;
      border-radius: 8px;
      text-align: center;
      min-width: 160px;
    }

    .total-box.br { background: #d8f3dc; }
    .total-box.us { background: #dbe4ff; }

    .total-box .moeda {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-bottom: 4px;
    }

    .total-box .valor {
      font-size: 20px;
      font-weight: 800;
      color: #1a1a2e;
    }

    .total-box.br .valor { color: #2d6a4f; }
    .total-box.us .valor { color: #1d3557; }

    .btn-limpar {
      margin-top: 16px;
      display: block;
      width: 100%;
      max-width: 820px;
      margin-left: auto;
      margin-right: auto;
      padding: 10px;
      background: #e63946;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }

    .btn-limpar:hover { background: #c1121f; }

    .nota {
      font-size: 11px;
      color: #aaa;
      text-align: center;
      margin-top: 12px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .card { padding: 14px; }
      .totais { flex-direction: column; align-items: flex-end; }
    }
  </style>
</head>
<body>

<h1>Formulário de Serviços</h1>
<p class="subtitle">Cálculo automático de valores por moeda</p>

<div class="card">

  <div class="data-row">
    <label>Data:</label>
    <input type="date" id="dataField" />
  </div>

  <table>
    <thead>
      <tr>
        <th>Serviço</th>
        <th>Moeda</th>
        <th>Quantidade</th>
        <th style="text-align:right">Valor</th>
      </tr>
    </thead>
    <tbody id="tabelaServicos">

      <!-- CPF -->
      <tr data-servico="CPF">
        <td class="servico-label">CPF</td>
        <td><select class="sel-moeda"><option value="">--</option><option value="BR">BR (R$)</option><option value="US">US ($)</option></select></td>
        <td><input type="number" class="inp-qtd" min="1" placeholder="0"/></td>
        <td class="valor-calc empty" id="val-CPF">—</td>
      </tr>

      <!-- CNPJ -->
      <tr data-servico="CNPJ">
        <td class="servico-label">CNPJ</td>
        <td><select class="sel-moeda"><option value="">--</option><option value="BR">BR (R$)</option><option value="US">US ($)</option></select></td>
        <td><input type="number" class="inp-qtd" min="1" placeholder="0"/></td>
        <td class="valor-calc empty" id="val-CNPJ">—</td>
      </tr>

      <!-- CNH -->
      <tr data-servico="CNH">
        <td class="servico-label">CNH</td>
        <td><select class="sel-moeda"><option value="">--</option><option value="BR">BR (R$)</option><option value="US">US ($)</option></select></td>
        <td><input type="number" class="inp-qtd" min="1" placeholder="0"/></td>
        <td class="valor-calc empty" id="val-CNH">—</td>
      </tr>

      <!-- PLACA -->
      <tr data-servico="PLACA">
        <td class="servico-label">Placa</td>
        <td><select class="sel-moeda"><option value="">--</option><option value="BR">BR (R$)</option><option value="US">US ($)</option></select></td>
        <td><input type="number" class="inp-qtd" min="1" placeholder="0"/></td>
        <td class="valor-calc empty" id="val-PLACA">—</td>
      </tr>

      <!-- VÍNCULOS (sem quantidade) -->
      <tr data-servico="VINCULOS">
        <td class="servico-label">Vínculos</td>
        <td><select class="sel-moeda"><option value="">--</option><option value="BR">BR (R$)</option><option value="US">US ($)</option></select></td>
        <td><span style="color:#aaa;font-size:12px;">Valor fixo</span></td>
        <td class="valor-calc empty" id="val-VINCULOS">—</td>
      </tr>

      <!-- VEÍCULO -->
      <tr data-servico="VEICULO">
        <td class="servico-label">Veículo</td>
        <td><select class="sel-moeda"><option value="">--</option><option value="BR">BR (R$)</option><option value="US">US ($)</option></select></td>
        <td><input type="number" class="inp-qtd" min="1" placeholder="0"/></td>
        <td class="valor-calc empty" id="val-VEICULO">—</td>
      </tr>

      <!-- IMÓVEIS (valor digitado × qtd) -->
      <tr data-servico="IMOVEIS">
        <td class="servico-label">Imóveis</td>
        <td><select class="sel-moeda"><option value="">--</option><option value="BR">BR (R$)</option><option value="US">US ($)</option></select></td>
        <td><input type="number" class="inp-qtd" min="1" placeholder="0"/></td>
        <td class="valor-calc empty">
          <input type="number" class="inp-valor-manual" placeholder="Valor unit." style="max-width:110px; text-align:right;" id="inp-IMOVEIS"/>
        </td>
      </tr>

      <!-- IMÓVEL RURAL -->
      <tr data-servico="IMOVELRURAL">
        <td class="servico-label">Imóvel Rural</td>
        <td><select class="sel-moeda"><option value="">--</option><option value="BR">BR (R$)</option><option value="US">US ($)</option></select></td>
        <td><input type="number" class="inp-qtd" min="1" placeholder="0"/></td>
        <td class="valor-calc empty" id="val-IMOVELRURAL">—</td>
      </tr>

    </tbody>
  </table>

  <div class="totais">
    <div class="total-box br">
      <div class="moeda">Total R$</div>
      <div class="valor" id="totalBR">R$ 0,00</div>
    </div>
    <div class="total-box us">
      <div class="moeda">Total US$</div>
      <div class="valor" id="totalUS">$ 0,00</div>
    </div>
  </div>

</div>

<button class="btn-limpar" onclick="limparTudo()">Limpar Formulário</button>
<p class="nota">Os valores são calculados automaticamente conforme a moeda selecionada.</p>

<script>
  // ---- Tabela de preços unitários ----
  const precos = {
    CPF:        { BR: 10,  US: 5  },
    CNPJ:       { BR: 10,  US: 5  },
    CNH:        { BR: 15,  US: 7  },
    PLACA:      { BR: 30,  US: 15 },
    VINCULOS:   { BR: 30,  US: 20 },
    VEICULO:    { BR: 50,  US: 20 },
    IMOVELRURAL:{ BR: 20,  US: 10 }
  }

  // ---- Data automática ----
  const dataField = document.getElementById('dataField')
  const hoje = new Date()
  dataField.value = hoje.toISOString().split('T')[0]

  // ---- Formatar moeda ----
  function fmt(valor, moeda) {
    if (moeda === 'BR') {
      return 'R$ ' + valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    }
    return '$ ' + valor.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
  }

  // ---- Calcular tudo ----
  function calcular() {
    let totalBR = 0, totalUS = 0

    document.querySelectorAll('#tabelaServicos tr').forEach(row => {
      const tipo = row.dataset.servico
      const sel = row.querySelector('.sel-moeda')
      const qtdInput = row.querySelector('.inp-qtd')
      const moeda = sel ? sel.value : ''
      const qtd = qtdInput ? parseFloat(qtdInput.value) || 0 : 0
      const celValor = document.getElementById('val-' + tipo)

      if (tipo === 'IMOVEIS') {
        // Imóveis: valor digitado × qtd
        const inpValor = document.getElementById('inp-IMOVEIS')
        const valorUnit = parseFloat(inpValor.value) || 0
        if (moeda && qtd >= 1 && valorUnit > 0) {
          const total = valorUnit * qtd
          if (moeda === 'BR') totalBR += total
          else totalUS += total
        }
        return
      }

      if (!moeda || !celValor) return

      if (tipo === 'VINCULOS') {
        // Valor fixo
        if (moeda) {
          const v = precos.VINCULOS[moeda]
          celValor.textContent = fmt(v, moeda)
          celValor.className = 'valor-calc ' + moeda.toLowerCase()
          if (moeda === 'BR') totalBR += v
          else totalUS += v
        } else {
          celValor.textContent = '—'
          celValor.className = 'valor-calc empty'
        }
        return
      }

      if (!moeda || qtd < 1) {
        celValor.textContent = '—'
        celValor.className = 'valor-calc empty'
        return
      }

      const valorUnit = precos[tipo][moeda]
      const total = valorUnit * qtd
      celValor.textContent = fmt(total, moeda)
      celValor.className = 'valor-calc ' + moeda.toLowerCase()

      if (moeda === 'BR') totalBR += total
      else totalUS += total
    })

    // Totais
    document.getElementById('totalBR').textContent = fmt(totalBR, 'BR')
    document.getElementById('totalUS').textContent = fmt(totalUS, 'US')
  }

  // ---- Limpar ----
  function limparTudo() {
    document.querySelectorAll('.sel-moeda').forEach(s => s.value = '')
    document.querySelectorAll('.inp-qtd').forEach(i => i.value = '')
    const inpImoveis = document.getElementById('inp-IMOVEIS')
    if (inpImoveis) inpImoveis.value = ''
    document.querySelectorAll('.valor-calc').forEach(c => {
      c.textContent = '—'
      c.className = 'valor-calc empty'
    })
    document.getElementById('totalBR').textContent = 'R$ 0,00'
    document.getElementById('totalUS').textContent = '$ 0,00'
    const hoje = new Date()
    dataField.value = hoje.toISOString().split('T')[0]
  }

  // ---- Eventos ----
  document.querySelectorAll('.sel-moeda, .inp-qtd, .inp-valor-manual').forEach(el => {
    el.addEventListener('change', calcular)
    el.addEventListener('input', calcular)
  })
</script>

</body>
</html>
